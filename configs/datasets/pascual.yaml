# Dataset config: estadio Pascual Guerrero (UAV oblicuo), empaquetado segpack_v1.
# Todo lo específico del dataset vive aquí; segpipe no tiene rutas ni IDs en el código.
# Para añadir otro dataset (p. ej. el de Mauricio) se copia este archivo y se ajusta.

name: pascual
version: segpack_v1

archive:
  filename: segpack_v1.zip
  size_bytes: 560108771
  sha256: 1ef52bcb49ef74c05d547f16b042cb9de2371cdd05ddb7119bc84d2c196f41ab
  # Google Drive (fuente principal). Se descarga con la cuenta del usuario (archivo privado OK).
  drive_file_id: 1daBp9IWCQMTe-Bza6DVsQwdYhLonFJ7k
  # Alternativa: Drive montado en /content/drive. Ruta al zip dentro de Mi unidad.
  drive_mounted_path: /content/drive/MyDrive/segpack_v1.zip
  # Respaldo manual (no automatizado): OneDrive, ver README.

local:
  # Raíz en la VM de Colab (disco local, nunca Drive).
  root_colab: /content/data
  # Raíz fuera de Colab (solo pruebas). Se puede sobrescribir con SEGPACK_ROOT.
  root_other: .data
  extract_dir: segpack_v1
  env_zip: SEGPACK_ZIP     # ruta a un zip local
  env_dir: SEGPACK_DIR     # ruta a una carpeta ya descomprimida

layout:
  classes: classes.json    # fuente de verdad del esquema de clases (index, name, rgb)
  manifest: manifest.csv
  class_stats: class_stats.csv

classes:
  # Píxeles sin polígono en CVAT. Se ignoran en la pérdida, las métricas y la matriz de confusión.
  ignore: [background]

geometry:
  # Columnas del manifest usadas para el centro de huella aproximado de la cámara oblicua.
  lat: GpsLatitude
  lon: GpsLongitude
  height: RelativeAltitude
  pitch: GimbalPitchDegree
  yaw: GimbalYawDegree
