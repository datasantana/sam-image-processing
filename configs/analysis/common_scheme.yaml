# Esquema común Pascual (12 clases) ↔ Mauricio (run05_b3_v2, 10 clases).
# Aprobado por el autor el 2026-11-15.
#
# Reglas de agregación (segpipe.analyze.aggregate):
#  - Se suman filas (clase real) y columnas (clase predicha) de la matriz de confusión según el mapeo.
#  - null = la clase no entra al esquema común: sus píxeles reales se ignoran (como background).
#  - unmapped_prediction (por lado): qué hacer con píxeles PREDICHOS en una clase null.
#      error → van a una columna "fuera_de_esquema": cuentan como fallo de la clase real y no entran al mIoU.
#      drop  → se descartan (como si no se hubieran predicho).
#
# Verificación del mapeo de Mauricio: por inspección visual de sus máscaras (el autor revisó que su
# via_pavimentada incluye vías pavimentadas, andenes y plazas). NO hay una definición escrita de sus
# clases; el mapeo no se verificó contra una.

approved: true
unmapped_prediction:
  mine: error          # sin efecto en el esquema principal: las 12 clases propias tienen destino
  mauricio: error      # lo predicho como sin_clase sobre píxeles etiquetados cuenta como error

# Criterio de clase evaluable del esquema común (decisión del autor, 2026-11-15): regla ÚNICA, igual en
# ambos lados, sin criterios adicionales.
#  - min_photos: la clase aparece en ≥ 5 fotos de test (el mismo K de mis corridas). Mauricio no tiene
#    matrices por foto: la regla se le aplica donde su xlsx declara el nº de fotos (LEEME: agua, 6 fotos →
#    evaluable); en el resto de sus clases no hay nº de fotos y se consideran evaluables si tienen píxeles.
#  - min_pixel_share_pct: null (sin umbral de píxeles). El soporte en píxeles se reporta solo como descripción.
#  - exclude: {} (sin exclusiones en el esquema principal; la variante sin_agua lo usa).
evaluability:
  min_photos: 5
  min_pixel_share_pct: null
  exclude: {}

# Notas al pie de la tabla principal, por lado y clase común.
footnotes:
  mauricio:
    agua: "6 fotos de prueba; el autor la reporta como no concluyente; sin IC"

common:
  - edificacion
  - superficie_pavimentada
  - suelo_sin_pavimentar
  - vegetacion
  - agua
  - vehiculo
  - otros_objetos

mine:                       # clases de classes.json (background ya es ignore_index)
  Buildings: edificacion
  Road Surface: superficie_pavimentada
  Paved Surface: superficie_pavimentada
  Parkinglots: superficie_pavimentada
  Brownfields: suelo_sin_pavimentar
  Ground Surface: suelo_sin_pavimentar
  Vegetation: vegetacion
  Sports Fields: vegetacion          # principalmente césped natural del estadio (decisión del autor)
  Pools: agua
  Vehicle: vehiculo
  Fence: otros_objetos
  Lightning Posts: otros_objetos

mauricio:                   # columnas de Matriz_confusion de Metricas_run05_b3_v2.xlsx
  sin_clase: null                    # no entra a su criterio; filas (real) ignoradas
  edificacion: edificacion
  via_pavimentada: superficie_pavimentada   # incluye vías pavimentadas, andenes y plazas (inspección visual)
  via_destapada: suelo_sin_pavimentar
  suelo_desnudo: suelo_sin_pavimentar
  vegetacion_alta: vegetacion
  vegetacion_baja: vegetacion
  agua: agua
  vehiculo: vehiculo
  otros_objetos: otros_objetos

# Análisis de sensibilidad (tablas aparte). Cada variante parte del esquema principal y cambia solo
# lo indicado.
variants:
  - name: sports_fields_fuera
    description: >-
      Sports Fields fuera del esquema: sus píxeles reales se ignoran y lo que mis modelos predicen como
      Sports Fields sobre píxeles etiquetados de otras clases cuenta como error (misma regla que sin_clase).
    mine: {Sports Fields: null}
  - name: sin_clase_descartado
    description: >-
      Lo que el modelo de Mauricio predijo como sin_clase sobre píxeles etiquetados se descarta en vez de
      contar como error.
    unmapped_prediction: {mauricio: drop}
  - name: sin_agua
    description: >-
      Agua fuera del mIoU en ambos lados (sus píxeles siguen en la matriz y en la OA). Justificación: la hoja
      LEEME de Mauricio dice «Agua: solo 73.473 px y 6 fotos en prueba; se reporta pero no es concluyente».
      Es análisis de sensibilidad; la cifra principal incluye agua.
    evaluability:
      exclude:
        agua: "variante sin_agua (LEEME de Mauricio: 6 fotos, no concluyente)"
